name: proof-of-play
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: the off-ramp against its falsifiable examples (L0 adapters, dedupe, extract, recall)
        run: node --test

      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the off-ramp law, then READ the verdict (must be CLEAN)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate kernel/offramp.mjs \
            --timeout 90000 --cap 800 --baseline witness.baseline.json \
            --test node --test test/all.test.mjs | tee verdict.txt
          grep -q "no test-theatre" verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
